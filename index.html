<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Learning Roadmap</title>
<style>
:root{
  --bg:#f6f6f3;--card:#fff;--text:#17191c;--muted:#727780;--border:#e5e5e1;
  --jp:#466d9a;--jp-soft:#eef4fb;--fin:#60775a;--fin-soft:#f0f4ee;--excel:#896746;
  --ink:#1e2329;--good:#556a50;--good-soft:#eff3ec;--warn:#8a6422;--warn-soft:#fbf1dc;
  --bad:#9a4242;--bad-soft:#f8eaea;--shadow:0 1px 2px rgba(23,25,28,.03)
}
*{box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg)}
button,input,textarea{font:inherit}
button,a,label{-webkit-tap-highlight-color:transparent}
a{color:inherit}
.hidden{display:none!important}
.app{max-width:920px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.date{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.01em}
h1{font-size:31px;line-height:1.05;letter-spacing:-.045em;margin:4px 0 0}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.view{display:none}.view.active{display:block}
.today-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 2px 12px}
.today-meta strong{font-size:14px}.tiny{font-size:12px;color:var(--muted)}
.setup{background:#fff8e8;border:1px solid #ead9ac;border-radius:14px;padding:12px 13px;margin-bottom:12px;font-size:13px;line-height:1.45}
.setup button{border:0;background:transparent;text-decoration:underline;font-weight:750;color:inherit;padding:4px}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.focus-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:19px;padding:17px 16px 15px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.focus-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.focus-card.jp-card{--accent:var(--jp);--soft:var(--jp-soft)}
.focus-card.fin-card{--accent:var(--fin);--soft:var(--fin-soft)}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:10px;text-transform:uppercase;letter-spacing:.045em;font-weight:800;color:var(--accent);background:var(--soft);padding:6px 9px;border-radius:999px;white-space:nowrap}
.session-minutes{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.focus-card h2{font-size:21px;line-height:1.15;letter-spacing:-.025em;margin:13px 0 5px}
.resource-name{font-size:13px;color:var(--muted);line-height:1.35;margin:0 0 14px}
.steps{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35}
.step-num{width:21px;height:21px;border-radius:50%;background:#f0f1f2;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none;margin-top:-1px}
.card-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.primary{min-height:44px;border:0;border-radius:12px;background:var(--ink);color:white;font-weight:760;padding:10px 14px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.secondary{min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-weight:720;padding:10px 14px}
.focus-card.complete{opacity:.72}
.focus-card.complete .primary{background:#eceeed;color:var(--muted)}
.pace-card,.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.pace-card{padding:15px 16px;margin-top:14px}
.pace-head,.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pace-head h2,.panel h2{font-size:17px;letter-spacing:-.018em;margin:0}
.status{font-size:11px;border-radius:999px;padding:6px 9px;font-weight:750;background:#eff0f1;color:var(--muted);white-space:nowrap}
.status.good{background:var(--good-soft);color:var(--good)}.status.warn{background:var(--warn-soft);color:var(--warn)}.status.bad{background:var(--bad-soft);color:var(--bad)}
.pace-row{margin-top:14px}.pace-label{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:7px}.pace-label b{font-size:13px}.pace-label span{color:var(--muted)}
.bar-bg{height:7px;background:#eceeec;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;width:0;transition:width .2s ease}.bar.jp{background:var(--jp)}.bar.fin{background:var(--fin)}
.delta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}
.panel{padding:17px;margin-bottom:13px}.panel-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--muted);margin:0 0 4px}.panel-copy{font-size:12px;color:var(--muted);line-height:1.45;margin:5px 0 0}
.track-section{margin-top:16px}.track-section:first-of-type{margin-top:12px}
.track-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.road-item{border-top:1px solid var(--border);padding:13px 0}.road-item:first-child{border-top:0}.road-item summary{list-style:none;display:flex;justify-content:space-between;gap:12px;cursor:pointer;align-items:center}.road-item summary::-webkit-details-marker{display:none}
.road-main{min-width:0}.phase{font-size:10px;text-transform:uppercase;letter-spacing:.055em;font-weight:800;color:var(--muted)}.road-title{font-size:15px;font-weight:760;margin-top:3px}.road-resource{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:16px;color:var(--muted)}
.road-body{padding:10px 0 1px}.road-note{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 10px}.resource-link{display:inline-flex;font-size:12px;font-weight:760;text-decoration:none;margin-bottom:10px}.resource-link:hover{text-decoration:underline}
.task-list{display:flex;flex-direction:column;gap:7px}.task{display:flex;align-items:flex-start;gap:9px;background:#f2f3f2;border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.35}.task input{width:19px;height:19px;accent-color:var(--ink);flex:none;margin:0}.task.done{color:var(--muted);text-decoration:line-through}
.current-tag{font-size:10px;padding:5px 7px;border-radius:999px;background:#f0f1f2;color:var(--muted);font-weight:800}.current-tag.now{background:var(--good-soft);color:var(--good)}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.log-box{background:#f1f2f1;border-radius:13px;padding:13px}.log-box label{font-size:13px;font-weight:760;display:block}.minutes-row{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:12px}.minutes-row input{width:92px}
input[type=number],input[type=date],textarea,input[type=text]{min-height:43px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 10px;color:var(--text);font-size:16px;width:100%}textarea{resize:vertical}
.checkbox{display:flex!important;gap:8px;align-items:center;margin-top:9px;font-size:12px!important;font-weight:600!important}.checkbox input{width:18px;height:18px;accent-color:var(--ink)}
.full{grid-column:1/-1}.save-msg{font-size:12px;color:var(--good);min-height:17px;margin:8px 0 0}
.history-row{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:12px;line-height:1.45}.history-row:first-child{border-top:0}.history-date{font-weight:750}.history-note{color:var(--muted);margin-top:3px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;background:#f1f2f1;border-radius:12px}
.library{margin-top:15px;border-top:1px solid var(--border);padding-top:12px}.resource-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--border)}.resource-row:first-child{border-top:0}.resource-row h3{font-size:14px;margin:0 0 3px}.resource-row p{font-size:12px;color:var(--muted);line-height:1.4;margin:0}.cost{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:5px 7px;height:max-content;color:var(--muted);font-weight:750}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(920px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(250,250,248,.94);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:8px 20px calc(10px + env(safe-area-inset-bottom));z-index:20}
.nav-btn{border:0;background:transparent;color:#8d9197;min-height:48px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav-icon{font-size:17px;line-height:1}.nav-btn.active{color:var(--text)}
dialog{border:0;border-radius:18px;padding:0;width:min(580px,calc(100% - 28px));background:var(--card);color:var(--text);box-shadow:0 20px 70px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(23,25,28,.32);backdrop-filter:blur(2px)}
.settings{padding:19px;display:flex;flex-direction:column;gap:13px}.settings-grid{display:grid;grid-template-columns:1fr1 1fr;gap:10px}.settings label{font-size:12px;color:var(--muted);font-weight:700}.settings input{margin-top:6px}.privacy{background:#f1f2f1;border-radius:12px;padding:11px;font-size:12px;line-height:1.45}.buttons{display:flex;gap:8px;flex-wrap:wrap}.file-input{display:none}.file-label{display:flex;align-items:center;justify-content:center;cursor:pointer}
